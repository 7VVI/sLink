<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShortLink · 短链控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffd02f'/%3E%3Cpath d='M13 21a4 4 0 0 0 6 .4l2.4-2.4a4 4 0 0 0-5.6-5.6l-1.3 1.3M19 11a4 4 0 0 0-6-.4l-2.4 2.4a4 4 0 0 0 5.6 5.6l1.3-1.3' fill='none' stroke='%231c1c1e' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0066cc; --accent-focus:#0071e3; --accent-soft:#e8f0fe;
  --gold:#FFD700; --gold-deep:#F59E0B;
  --ink:#1d1d1f; --ink-2:#333333; --ink-3:#6e6e73; --muted:#86868b; --muted-2:#a1a1a6;
  --canvas:#ffffff; --parchment:#f5f5f7; --pearl:#fafafc;
  --hairline:#e0e0e0; --divider:#f0f0f0; --chip:#d2d2d7;
  --green:#1d7a3f; --green-soft:#e8f8ef; --orange:#b25000; --orange-soft:#fff4e5;
  --red:#d70015; --red-soft:#ffe9e8; --danger-bg:#ff3b30;
  --black:#000000;
  --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
  --sh-modal:0 24px 60px -12px rgba(0,0,0,.18);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--parchment);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(0,102,204,.18)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d2d2d7;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b8b8bd}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,'Courier New',monospace;font-size:12.5px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1}
:focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 24px;border-radius:var(--r-pill);font-size:15px;font-weight:400;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,transform .12s;user-select:none;-webkit-tap-highlight-color:transparent}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-focus)}
.btn-primary:active{background:#0056b3}
.btn-danger{background:var(--danger-bg);color:#fff}
.btn-danger:hover{background:#e6352b}
.btn-pearl{background:var(--pearl);border-color:rgba(0,0,0,.1);color:var(--ink);border-radius:var(--r-md)}
.btn-pearl:hover{background:#f2f2f7;border-color:rgba(0,0,0,.16)}
.btn-secondary{background:var(--pearl);border-color:rgba(0,0,0,.1);color:var(--ink);border-radius:var(--r-md)}
.btn-secondary:hover{background:#f2f2f7;border-color:rgba(0,0,0,.16)}
.btn-ghost{background:transparent;color:var(--ink-3);padding:0 12px;height:36px;border-radius:var(--r-sm)}
.btn-ghost:hover{background:#f2f2f7;color:var(--ink)}
.btn-ghost.danger-text{color:var(--red)}
.btn-ghost.danger-text:hover{background:var(--red-soft);color:var(--red)}
.btn-sm{height:32px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.btn-lg{height:46px;font-size:16px}
.btn-secondary .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ============ 表单 ============ */
.field{margin-bottom:16px}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px;letter-spacing:-.01em}
.req{color:var(--red);font-style:normal}
.opt{color:var(--muted);font-weight:400;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
.input{width:100%;height:44px;border:1px solid var(--chip);border-radius:var(--r-md);padding:0 14px;font-size:15px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--muted-2)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,102,204,.16)}
.ta{height:auto;min-height:92px;padding:12px 14px;resize:vertical;line-height:1.55}

/* ============ 顶部 / 侧边栏 ============ */
.promo{display:flex;align-items:center;gap:12px;background:var(--black);color:#fff;padding:8px 24px;font-size:12.5px}
.promo-pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.promo-text{color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shell{display:flex;min-height:calc(100vh - 35px)}
.sidebar{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--hairline);display:flex;flex-direction:column;padding:22px 14px 18px;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:2px 8px 20px}
.sidebar .brand-name{color:var(--ink)}
.sidebar .brand-sub{color:var(--muted)}
.snav-label{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);padding:14px 10px 8px}
.snav-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:14px;font-weight:400;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;margin-bottom:2px;position:relative}
.snav-item svg{width:16px;height:16px;flex-shrink:0}
.snav-item:hover{background:#f2f2f7;color:var(--ink)}
.snav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.snav-item.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.suser{margin-top:auto;border-top:1px solid var(--divider);padding:16px 8px 2px;display:flex;align-items:center;gap:10px}
.savatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.suser-info{min-width:0;flex:1}
.suser-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suser-sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.slogout{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--hairline);background:none;color:var(--ink-3);font-size:12px;cursor:pointer;transition:all .12s;flex-shrink:0}
.slogout svg{width:13px;height:13px}
.slogout:hover{background:#f2f2f7;color:var(--accent);border-color:var(--chip)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--hairline);background:rgba(245,245,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:100}
.mobile-nav{display:none;gap:6px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--hairline);background:#fff}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark svg{width:17px;height:17px}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.pill-tab{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--hairline);background:#fff;color:var(--ink-2);font-size:13.5px;font-weight:400;cursor:pointer;transition:all .15s;white-space:nowrap}
.pill-tab svg{width:15px;height:15px}
.pill-tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pill-tab:not(.on):hover{color:var(--ink);border-color:var(--chip)}
.api-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--hairline);background:#fff;color:var(--ink-3);font-size:12px;cursor:pointer;transition:all .15s}
.api-chip.static{cursor:default;background:var(--pearl);color:var(--muted)}
.api-chip svg{width:14px;height:14px}
.api-chip:hover{border-color:var(--chip);color:var(--ink)}
.search-pill{display:flex;align-items:center;gap:8px;height:38px;width:248px;padding:0 15px;border-radius:999px;background:#fff;border:1px solid var(--hairline);color:var(--ink-3);transition:all .15s}
.search-pill svg{width:15px;height:15px;flex-shrink:0}
.search-pill input{border:none;outline:none;flex:1;min-width:0;font-size:13.5px;color:var(--ink);background:transparent}
.search-pill input::placeholder{color:var(--muted-2)}
.search-pill:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,102,204,.14);background:#fff}

/* ============ 页面 ============ */
.page{max-width:1280px;margin:0 auto;padding:30px 24px 72px;animation:fadeUp .25s ease}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.page-sub{font-size:13.5px;color:var(--muted);margin-top:5px}
.head-actions{display:flex;gap:10px;flex-shrink:0}
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-note{font-size:12.5px;color:var(--muted)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{display:flex;gap:14px;align-items:flex-start;padding:20px;border:1px solid var(--hairline);border-radius:var(--r-lg);background:#fff}
.tint-yellow,.tint-teal,.tint-coral,.tint-lav{background:#fff}
.stat-icon{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:17px;height:17px}
.stat-body{min-width:0}
.stat-label{font-size:13px;font-weight:400;color:var(--ink-3)}
.stat-value{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.stat-foot{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg)}
.table-card{margin-top:16px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:400;color:var(--muted);text-align:left;padding:13px 18px;border-bottom:1px solid var(--divider);background:var(--pearl);white-space:nowrap}
.tbl td{padding:14px 18px;font-size:14px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#fafafa}
.short-cell{display:flex;align-items:center;gap:8px}
.short-code{font-weight:600;color:var(--ink);white-space:nowrap}
.short-code:hover{color:var(--accent);text-decoration:none}
.icon-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:none;background:none;color:var(--muted);cursor:pointer;transition:all .12s;flex-shrink:0}
.icon-btn svg{width:15px;height:15px}
.icon-btn:hover{background:#f2f2f7;color:var(--ink)}
.icon-btn.danger:hover{background:var(--red-soft);color:var(--red)}
.icon-btn.mini{width:26px;height:26px}
.t-title{font-weight:600;color:var(--ink)}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}
.long-cell{max-width:260px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3)}
.long-cell a{color:inherit}
.long-cell a:hover{color:var(--accent)}
.exp{display:flex;align-items:center;gap:8px;white-space:nowrap}
.exp-tag{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.exp-tag.ok{background:#f2f2f7;color:var(--ink-3)}
.exp-tag.warn{background:var(--orange-soft);color:var(--orange)}
.exp-tag.red{background:var(--red-soft);color:var(--red)}
.perm{color:var(--green);font-weight:600;white-space:nowrap}
.row-acts{display:flex;align-items:center;gap:6px;justify-content:flex-end;opacity:.7;transition:opacity .15s}
tr:hover .row-acts{opacity:1}
.link-btn{background:none;border:none;padding:4px 6px;border-radius:6px;color:var(--accent);font-size:13px;font-weight:400;cursor:pointer;transition:all .12s}
.link-btn:hover{background:var(--accent-soft);text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.s-on{background:var(--green-soft);color:var(--green)}
.s-off{background:#f2f2f7;color:var(--ink-3)}
.s-del{background:var(--red-soft);color:var(--red)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.chip-yellow{background:var(--accent-soft);color:var(--accent)}
.chip-gray{background:#f2f2f7;color:var(--ink-3)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--divider);flex-wrap:wrap}
.pager-info{font-size:12.5px;color:var(--muted)}
.pager-btns{display:flex;gap:4px;align-items:center}
.page-btn{min-width:30px;height:30px;padding:0 8px;border-radius:8px;border:1px solid transparent;background:transparent;font-size:13px;color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.page-btn svg{width:14px;height:14px}
.page-btn:hover{background:#f2f2f7;color:var(--ink)}
.page-btn.on{background:var(--accent);color:#fff;font-weight:600}
.page-btn:disabled{opacity:.4;cursor:default}
.empty{padding:60px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center}
.empty-icon{width:52px;height:52px;border-radius:16px;background:#f2f2f7;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty-icon svg{width:22px;height:22px}
.empty-title{font-size:14px;font-weight:600;color:var(--ink-2)}
.empty-sub{font-size:12.5px;margin-top:4px}
.sk-line{height:14px;border-radius:6px;background:linear-gradient(90deg,#f1f2f4 25%,#e7e9ee 37%,#f1f2f4 63%);background-size:400% 100%;animation:sk 1.4s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.api-strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding:12px 16px;border:1px solid var(--hairline);border-radius:12px;background:var(--pearl);color:var(--muted);font-size:12.5px}
.as-title{display:inline-flex;align-items:center;gap:7px;color:var(--ink-3);font-weight:600}
.as-title svg{width:14px;height:14px}
.as-items{font-size:11.5px;color:var(--muted)}

/* ============ 弹窗 ============ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;animation:fade .15s ease}
.modal{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--sh-modal);width:520px;max-width:calc(100vw - 40px);max-height:calc(100vh - 48px);display:flex;flex-direction:column;animation:pop .18s ease}
.modal-lg{width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px 0;flex-shrink:0}
.modal-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal-body{padding:18px 24px 8px;overflow:auto}
.modal-foot{display:flex;align-items:center;gap:10px;padding:16px 24px 22px;border-top:1px solid var(--divider);margin-top:14px;flex-shrink:0}
.detail-loading,.chart-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 0;color:var(--muted);font-size:13.5px}
.chart-loading{padding:80px 0}
.detail-top{display:flex;align-items:center;gap:10px;padding:4px 0 2px}
.detail-code{font-size:22px;font-weight:600;letter-spacing:-.01em}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.info-item{background:var(--pearl);border:1px solid var(--divider);border-radius:12px;padding:12px 14px;min-width:0}
.info-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.info-val{font-size:13.5px;color:var(--ink)}
.info-val a{color:var(--accent)}
.span2{grid-column:1 / -1}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.mini-stat{padding:16px;border:1px solid var(--hairline);border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.mini-icon{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.mini-icon svg{width:16px;height:16px}
.mini-label{font-size:12.5px;color:var(--ink-3);font-weight:400}
.mini-value{font-size:24px;font-weight:600;letter-spacing:-.02em}
.chart-card{margin-top:16px;padding:18px 20px 14px;border:1px solid var(--hairline);border-radius:var(--r-lg);background:#fff}
.chart-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.chart-title{font-size:14.5px;font-weight:600}
.chart-legend{display:flex;gap:14px;margin-left:4px}
.lg-item{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.lg-dot{width:8px;height:8px;border-radius:50%}
.lg-dot.teal{background:var(--accent)}
.lg-dot.blue{background:var(--accent-focus)}
.seg{display:inline-flex;background:#f2f2f7;border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.seg-btn{border:none;background:transparent;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:400;color:var(--ink-3);cursor:pointer;transition:all .12s}
.seg-btn.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chart-box{position:relative}
.chart-svg{width:100%;height:auto;display:block}
.tick{font-size:10.5px;fill:var(--muted);font-family:inherit}
.chart-tip{position:absolute;opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .12s;z-index:5;white-space:nowrap;transform:translateY(-100%)}
.tt-date{font-weight:600;margin-bottom:3px}
.tt-row{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.85)}
.tt-dot{width:8px;height:8px;border-radius:50%}
.tt-dot.teal{background:var(--accent)}
.tt-dot.blue{background:var(--accent-focus)}
.chart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 0;color:var(--muted);font-size:13px}
.chart-empty .empty-icon{margin-bottom:0}
.confirm-body{display:flex;gap:14px;padding:8px 0 6px}
.confirm-icon{width:42px;height:42px;border-radius:13px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.confirm-icon svg{width:18px;height:18px}
.confirm-text{font-size:14px;font-weight:600;line-height:1.6}
.confirm-text .code{font-weight:600}
.confirm-sub{font-size:13px;color:var(--muted);margin-top:4px}
.done-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px;text-align:center}
.done-icon{width:48px;height:48px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center}
.done-icon svg{width:22px;height:22px}
.done-short{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:14px 0 12px}
.done-meta{margin-top:18px;display:grid;gap:10px}

/* ============ Toast ============ */
#toast-root{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:400}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:400;padding:11px 18px;border-radius:999px;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastIn .2s ease;max-width:min(92vw,520px)}
.toast svg{width:16px;height:16px;flex-shrink:0;color:var(--accent-focus)}
.toast.err svg{color:var(--danger-bg)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.login-page{display:flex;min-height:100vh;background:radial-gradient(1100px 760px at 66% 30%,#FFFFFF 0%,#F4F6FA 55%,#EDF0F5 100%);color:var(--ink);position:relative;overflow:hidden}
.login-hero{width:58%;flex-shrink:0;display:flex;flex-direction:column;padding:48px 56px 40px;position:relative;overflow:hidden}
.hero-net{position:absolute;left:-90px;bottom:-120px;width:540px;height:540px;opacity:.9;pointer-events:none}
.hero-net svg{width:100%;height:100%}
.hero-glow{position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.22),transparent 60%);top:-160px;right:-120px;pointer-events:none}
.hero-arc{position:absolute;border:1px solid rgba(184,134,11,.16);border-radius:50%;pointer-events:none}
.hero-arc.a1{width:380px;height:380px;top:-170px;right:-110px}
.hero-arc.a2{width:260px;height:260px;top:-100px;right:-60px}
.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;min-width:0}
.hero-brand{display:flex;align-items:center;gap:12px}
.hero-brand-mark{width:40px;height:40px;border-radius:10px;background:var(--gold);color:#0A0E1A;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 24px rgba(255,215,0,.4)}
.hero-brand-mark svg{width:20px;height:20px}
.hero-brand-name{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15;color:var(--ink)}
.hero-brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hero-title{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-top:46px;color:var(--ink)}
.hero-subtitle{font-size:17px;color:var(--ink-2);margin-top:14px}
.hl-gold{color:#A16207;font-weight:600}
.hero-desc{margin-top:24px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-3);line-height:1.7}
.login-side{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:44px 34px}
.login-card{width:420px;max-width:100%;background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:34px 34px 26px;box-shadow:0 4px 6px rgba(0,0,0,.05),0 24px 60px rgba(15,23,42,.08);animation:fadeUp .3s ease}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px;text-align:center}
.auth-brand-mark{width:46px;height:46px;border-radius:12px;background:var(--gold);color:#0A0E1A;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(255,215,0,.35)}
.auth-brand-mark svg{width:23px;height:23px}
.auth-brand-name{font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.auth-brand-sub{font-size:11.5px;color:var(--muted)}

.btn-gold svg{width:15px;height:15px}

}

const day=864e5;
const nowT=Date.now();
const iso=off=>new Date(nowT+off*day).toISOString();
function mockLink(code,longUrl,title,status,expDays,createdDays){
  return {code,shortUrl:'http://localhost:8080/'+code,longUrl,title,status,
    expireTime:expDays===null?null:iso(expDays),createTime:iso(-createdDays)};
}
const MOCK_LINKS=[
  mockLink('Ab3xK9p','https://owen.dev/blog/short-link-architecture','短链系统架构解析',1,120,18),
  mockLink('mX7Q2v','https://shop.example.com/618/sale?utm=shortlink','618 大促落地页',1,38,12),
  mockLink('k9Lp4d','https://weibo.com/example/status/987654321','微博活动帖',1,null,9),
  mockLink('Qw8Er6','https://github.com/org/repo/releases','产品更新日志',0,-3,30),
  mockLink('z2CdFg','https://testflight.apple.com/join/abcd','App 内测下载',1,5,6),
  mockLink('n5HbJk','https://owen.dev/pricing?lang=zh','定价页（中文）',1,null,4),
  mockLink('v7TcMl','https://owen.dev/newsletter','电子报订阅',0,null,15),
  mockLink('j3UsEr','https://events.example.com/summit/register','线上峰会报名',1,2,2),
  mockLink('a6GhKj','https://campaign.example.com/2025','旧版活动页',2,null,200),
  mockLink('p8iWxq','https://docs.example.com/legacy','废弃文档',2,-20,90),
];
const MOCK_USERS={};
let mockUser=null;
function mockErr(code,msg){ const e=new Error(msg); e.code=code; throw e; }
function mockPage(list,no,size){ const total=list.length; const pages=Math.max(1,Math.ceil(total/size)); return {total,size,current:no,pages,records:list.slice((no-1)*size,no*size)}; }
function mockStats(code){ const r=mulberry32(hash(code)); const todayPv=Math.round(25+r()*320); return {code,todayPv,todayUv:Math.round(todayPv*(0.32+r()*0.4)),totalPv:Math.round(900+r()*90000)}; }
function mockHistory(code,days){ const r=mulberry32(hash(code)*31+days); const out=[]; for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const wd=(d.getDay()===0||d.getDay()===6)?0.62:1; const base=Math.round(40+r()*220); const pv=Math.max(3,Math.round(base*wd*(0.75+r()*0.55))); out.push({statDate:d.toISOString().slice(0,10),pv,uv:Math.max(1,Math.round(pv*(0.25+r()*0.35)))}); } return out; }
function mockRoute(p,m,body){
  const u=new URL(p,'http://mock.local');
  const seg=u.pathname.split('/').filter(Boolean);
  const q=u.searchParams;
  if(seg[0]!=='api') mockErr(40400,'资源不存在');
  if(seg[1]==='auth'){
    if(seg[2]==='login'&&m==='POST'){
      const nm=(body.username||'').trim(), pw=(body.password||'').trim();
      if(!nm||!pw) mockErr(42002,'用户名或密码错误');
      const isAdmin=nm==='admin'&&pw==='admin123';
      mockUser={id:isAdmin?1:2,username:nm,nickname:isAdmin?'系统管理员':(MOCK_USERS[nm]?MOCK_USERS[nm]:nm),role:isAdmin?'ADMIN':'USER'};
      return {tokenName:'shortLinkToken',tokenValue:'preview-token-'+hash(nm),userId:mockUser.id,nickname:mockUser.nickname,role:mockUser.role};
    }
    if(seg[2]==='register'&&m==='POST'){
      const nm=(body.username||'').trim(), pw=(body.password||'').trim();
      if(!/^[a-zA-Z0-9_]{3,32}$/.test(nm)) mockErr(40001,'用户名仅支持 3-32 位字母、数字、下划线');
      if(pw.length<6) mockErr(40001,'密码长度需在 6-64 位之间');
      if(MOCK_USERS[nm]) mockErr(42001,'用户名已存在');
      MOCK_USERS[nm]=body.nickname||nm;
      return 1001+Object.keys(MOCK_USERS).length;
    }
    if(seg[2]==='logout'){ mockUser=null; return null; }
    if(seg[2]==='me'){ if(!mockUser) mockErr(40100,'未登录或登录已过期'); return mockUser; }
  }
  if(seg[1]==='short-links'){
    const code=seg[2];
    if(seg.length===2&&m==='GET'){
      const list=MOCK_LINKS.filter(l=>l.status!==2);
      return mockPage(list,+q.get('pageNo')||1,+q.get('pageSize')||10);
    }
    if(seg.length===2&&m==='POST'){
      const longUrl=(body.longUrl||'').trim();
      if(!longUrl) mockErr(40001,'长链接不能为空');
      let nu; try{ nu=new URL(longUrl); }catch(e){ mockErr(41001,'长链接不合法'); }
      if(!/^https?:$/.test(nu.protocol)) mockErr(41001,'长链接不合法');
      const chars='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
      let code=''; const r=mulberry32(hash(longUrl)+nowT);
      for(let i=0;i<7;i++) code+=chars[Math.floor(r()*chars.length)];
      const link={code,shortUrl:'http://localhost:8080/'+code,longUrl,title:(body.title||'').trim()||null,status:1,
        expireTime:body.expireDays?iso(body.expireDays):null,createTime:new Date().toISOString()};
      MOCK_LINKS.unshift(link);
      return link;
    }
    if(seg.length===3&&m==='GET'){ const l=MOCK_LINKS.find(x=>x.code===code); if(!l) mockErr(40400,'资源不存在'); return {...l,stats:mockStats(code)}; }
    if(seg.length===4&&seg[3]==='status'&&m==='PUT'){ const l=MOCK_LINKS.find(x=>x.code===code); if(!l) mockErr(40400,'资源不存在'); l.status=body.enabled?1:0; return null; }
    if(seg.length===3&&m==='DELETE'){ const i=MOCK_LINKS.findIndex(x=>x.code===code); if(i<0) mockErr(40400,'资源不存在'); MOCK_LINKS.splice(i,1); return null; }
  }
  if(seg[1]==='stats'&&seg[2]){
    if(seg[3]==='history') return mockHistory(seg[2],Math.min(365,Math.max(1,+q.get('days')||7)));
    return mockStats(seg[2]);
  }
  if(seg[1]==='admin'&&seg[2]==='short-links'){
    if(seg.length===3&&m==='GET'){
      let list=MOCK_LINKS.slice();
      if(q.get('status')!==null){ const st=+q.get('status'); list=list.filter(l=>l.status===st); }
      return mockPage(list,+q.get('pageNo')||1,+q.get('pageSize')||10);
    }
    if(seg.length===5&&seg[4]==='status'&&m==='PUT'){ const l=MOCK_LINKS.find(x=>x.code===seg[3]); if(!l) mockErr(40400,'资源不存在'); l.status=body.enabled?1:0; return null; }
    if(seg.length===4&&m==='DELETE'){ const i=MOCK_LINKS.findIndex(x=>x.code===seg[3]); if(i<0) mockErr(40400,'资源不存在'); MOCK_LINKS.splice(i,1); return null; }
  }
  mockErr(40400,'资源不存在');
}
function mockRequest(path,{method='GET',body}={}){
  return new Promise((resolve,reject)=>{
    setTimeout(()=>{ try{ resolve(mockRoute(path,method,body)); }catch(e){ reject(e); } },160+Math.random()*240);
  });
}

/* ============ 我的短链 ============ */
function statCards(p){
  if(!p) return Array(4).fill(`<div class="stat-card tint-yellow"><div class="stat-icon">${I.chart}</div><div class="stat-body"><div class="stat-label">加载中</div><div class="stat-value">…</div></div></div>`).join('');
  const rec=p.records||[];
  const on=rec.filter(r=>r.status===1).length;
  const off=rec.filter(r=>r.status===0).length;
  const soon=rec.filter(r=>{ if(!r.expireTime) return false; const d=new Date(r.expireTime); return !isNaN(d)&&d>nowT&&d-nowT<=7*day; }).length;
  const items=[
    {label:'短链总数',value:fmtNum(p.total),foot:'全部（含回收）',icon:'link',tint:'yellow'},
    {label:'上线中',value:fmtNum(on),foot:'当前页',icon:'power',tint:'teal'},
    {label:'已下线',value:fmtNum(off),foot:'当前页',icon:'eye',tint:'coral'},
    {label:'7 天内到期',value:fmtNum(soon),foot:'当前页',icon:'clock',tint:'lav'},
  ];
  return items.map(it=>`<div class="stat-card tint-${it.tint}"><div class="stat-icon">${I[it.icon]}</div><div class="stat-body"><div class="stat-label">${it.label}</div><div class="stat-value tnum">${it.value}</div><div class="stat-foot">${it.foot}</div></div></div>`).join('');
}
function filterRows(rec){ const s=S.search; return s?rec.filter(r=>(r.title||'').toLowerCase().includes(s)||r.code.toLowerCase().includes(s)||(r.longUrl||'').toLowerCase().includes(s)):rec; }
function shortCell(r){ return `<div class="short-cell"><a class="mono short-code" href="${esc(r.shortUrl)}" target="_blank" rel="noopener" title="打开短链">${esc(stripProto(r.shortUrl))}</a><button class="icon-btn mini" data-act="copy" data-val="${esc(r.shortUrl)}" title="复制">${I.copy}</button></div>`; }
function expireCell(t){
  if(!t) return '<span class="perm">永久有效</span>';
  const d=new Date(t); if(isNaN(d)) return esc(t);
  const days=Math.ceil((d-nowT)/day);
  const cls=days<0?'red':days<=7?'warn':'ok';
  return `<div class="exp"><span class="tnum">${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}</span><span class="exp-tag ${cls}">${days<0?'已过期':days===0?'今日到期':days+' 天后'}</span></div>`;
}
function rowActions(r){
  if(r.status===2) return `<div class="row-acts"><button class="link-btn" data-act="open-detail" data-code="${esc(r.code)}">详情</button></div>`;

  return `<div class="row-acts">
    <button class="link-btn" data-act="open-detail" data-code="${esc(r.code)}">详情</button>
    <button class="link-btn" data-act="toggle-status" data-code="${esc(r.code)}" data-target="${on?0:1}">${on?'下线':'上线'}</button>

  const rec=p.records||[];
  const on=rec.filter(r=>r.status===1).length;
  const off=rec.filter(r=>r.status===0).length;
  const del=rec.filter(r=>r.status===2).length;
  const items=[
    {label:'全部短链',value:fmtNum(p.total),foot:'全部（含回收）',icon:'link',tint:'yellow'},
    {label:'上线中',value:fmtNum(on),foot:'当前页',icon:'power',tint:'teal'},
    {label:'已下线',value:fmtNum(off),foot:'当前页',icon:'eye',tint:'coral'},
    {label:'已删除',value:fmtNum(del),foot:'当前页',icon:'trash',tint:'lav'},

  return items.map(it=>`<div class="stat-card tint-${it.tint}"><div class="stat-icon">${I[it.icon]}</div><div class="stat-body"><div class="stat-label">${it.label}</div><div class="stat-value tnum">${it.value}</div><div class="stat-foot">${it.foot}</div></div></div>`).join('');
}

/* ============ 图表 ============ */
function chartSVG(rows){
  if(!rows||!rows.length) return `<div class="chart-empty"><div class="empty-icon">${I.chart}</div>暂无历史统计数据</div>`;
  const W=720,H=240,L=40,R=14,T=18,B=30;
  const maxV=Math.max(1,...rows.map(r=>Math.max(r.pv,r.uv)))*1.15;
  const pw=W-L-R, ph=H-T-B, n=rows.length, step=pw/n;
  const y=v=>T+ph-(v/maxV)*ph;
  const x=i=>L+step*i+step/2;
  const ticks=[0,0.5,1].map(f=>{ const v=maxV*f; return `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#f0f0f0"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="tick">${fmtWan(Math.round(v))}</text>`; }).join('');
  const bars=rows.map((r,i)=>{ const bw=Math.max(2,Math.min(step*0.52,20)); return `<rect class="bar" data-tip="${i}" x="${(x(i)-bw/2).toFixed(1)}" y="${y(r.pv).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,T+ph-y(r.pv)).toFixed(1)}" rx="3" fill="#0066cc"/>`; }).join('');
  const uvPts=rows.map((r,i)=>x(i).toFixed(1)+','+y(r.uv).toFixed(1)).join(' ');
  const area=`<polygon fill="url(#uvGrad)" points="${L},${T+ph} ${uvPts} ${(L+step*(n-1)).toFixed(1)},${T+ph}"/>`;
  const line=`<polyline points="${uvPts}" fill="none" stroke="#2997ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const dots=rows.map((r,i)=>`<circle class="dot" data-tip="${i}" cx="${x(i).toFixed(1)}" cy="${y(r.uv).toFixed(1)}" r="3.4" fill="#fff" stroke="#2997ff" stroke-width="2"/>`).join('');
  const lb=Math.max(1,Math.ceil(n/7));
  const labels=rows.map((r,i)=> i%lb===0||i===n-1?`<text x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle" class="tick">${fmtDay(r.statDate)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" id="chart-svg" role="img" aria-label="访问趋势图">
    <defs><linearGradient id="uvGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2997ff" stop-opacity=".14"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></linearGradient></defs>
    ${ticks}${bars}${area}${line}${dots}${labels}
  </svg><div class="chart-tip" id="chart-tip"></div>`;
}
function bindChart(rows){
  const svg=$('#chart-svg'); const tip=$('#chart-tip');
  if(!svg||!tip) return;
  const show=(i,e)=>{ const r=rows[i]; if(!r) return;
    tip.innerHTML=`<div class="tt-date">${fmtDay(r.statDate)}</div><div class="tt-row"><span class="tt-dot teal"></span>PV ${fmtNum(r.pv)}</div><div class="tt-row"><span class="tt-dot blue"></span>UV ${fmtNum(r.uv)}</div>`;
    const rect=svg.getBoundingClientRect();
    tip.style.left=Math.min(Math.max(e.clientX-rect.left-72,0),rect.width-150)+'px';
    tip.style.top=(e.clientY-rect.top-14)+'px';
    tip.style.opacity=1;
  };
  const hide=()=>{ tip.style.opacity=0; };
  svg.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mousemove',e=>show(+el.getAttribute('data-tip'),e));
    el.addEventListener('mouseleave',hide);
  });
}

/* ============ 操作 ============ */
async function doLogin(u,p){
  S.authLoading=true; S.authError=''; renderLogin();
  try{
    const d=await request('/api/auth/login',{method:'POST',body:{username:u,password:p},auth:false});
    token=d.tokenValue;
    user={userId:d.userId,username:u,nickname:d.nickname,role:d.role};
    localStorage.setItem(LS.token,token);
    localStorage.setItem(LS.user,JSON.stringify(user));
    S.authLoading=false; S.loginTab='login'; S.view='links'; S.page=1; S.linksPage=null; S.adminPageData=null;
    renderApp(); loadLinks();
    toast('欢迎回来，'+user.nickname);
  }catch(e){
    S.authLoading=false; S.authError=e.message||'登录失败'; renderLogin();
  }
}
async function doRegister(u,p,nick){
  S.authLoading=true; S.authError=''; renderLogin();
  try{
    await request('/api/auth/register',{method:'POST',body:{username:u,password:p,nickname:nick},auth:false});
    await doLogin(u,p);
  }catch(e){ S.authLoading=false; S.authError=e.message||'注册失败'; renderLogin(); }
}
async function doLogout(){
  try{ await request('/api/auth/logout',{method:'POST'}); }catch(e){}
  clearAuth(); S.view='links'; S.page=1; S.linksPage=null; S.adminPageData=null;
  renderApp(); toast('已退出登录');
}
async function doCreate(f){
  const fd=new FormData(f);
  const longUrl=(fd.get('longUrl')||'').trim();
  const title=(fd.get('title')||'').trim();
  const ed=(fd.get('expireDays')||'').trim();
  let expireDays=null;
  if(ed){ expireDays=parseInt(ed,10); if(!(expireDays>=1&&expireDays<=3650)){ toast('有效期需为 1–3650 的整数','err'); return; } }
  let nu; try{ nu=new URL(longUrl); }catch(e){ toast('请输入合法的 http/https 链接','err'); return; }
  if(!/^https?:$/.test(nu.protocol)){ toast('请输入合法的 http/https 链接','err'); return; }
  S.submitting=true; renderModal();
  try{
    const d=await request('/api/short-links',{method:'POST',body:{longUrl,title,expireDays}});
    S.created=d; S.createStep='done'; S.submitting=false;
    renderModal(); loadLinks();
  }catch(e){ S.submitting=false; renderModal(); handleErr(e); }
}
async function doToggle(code,enabled){
  try{
    if(S.view==='admin') await request('/api/admin/short-links/'+code+'/status',{method:'PUT',body:{enabled}});
    else await request('/api/short-links/'+code+'/status',{method:'PUT',body:{enabled}});
    toast(enabled?'已上线，跳转秒级生效':'已下线，跳转立即失效');
    if(S.modal&&S.modal.type==='detail'&&S.modal.code===code&&S.detail){ S.detail={...S.detail,status:enabled?1:0}; renderModal(); }
    if(S.view==='admin') loadAdmin(); else loadLinks();
  }catch(e){ handleErr(e); }
}
async function doDelete(){
  const code=S.modal&&S.modal.data?S.modal.data.code:null;
  if(!code) return;
  S.confirmLoading=true; renderModal();
  try{
    if(S.view==='admin') await request('/api/admin/short-links/'+code,{method:'DELETE'});
    else await request('/api/short-links/'+code,{method:'DELETE'});
    closeModal(); toast('短链已删除');
    if(S.view==='admin') loadAdmin(); else loadLinks();
  }catch(e){ S.confirmLoading=false; renderModal(); handleErr(e); }
}
/* ============ 事件 ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;
  switch(act){
    case 'tab': S.loginTab=el.dataset.t; S.authError=''; renderLogin(); break;
    case 'toggle-pw':{
      const wrap=el.closest('.input-wrap');
      const inp=wrap&&wrap.querySelector('input');
      if(inp){ const show=inp.type==='password'; inp.type=show?'text':'password'; el.innerHTML=show?I.eyeOff:I.eye; }
      break;
    }
    case 'noop': e.preventDefault(); break;
    case 'nav': S.view=el.dataset.view; renderShell(); renderMain(); if(S.view==='links') loadLinks(); else loadAdmin(); break;
    case 'demo-login': doLogin('admin','admin123'); break;
    case 'logout': doLogout(); break;
    case 'refresh': if(S.view==='admin') loadAdmin(); else loadLinks(); break;
    case 'page':{ const no=+el.dataset.no; if(no<1) return; if(S.view==='admin'){ S.adminPage=no; loadAdmin(); } else { S.page=no; loadLinks(); } break; }
    case 'filter-status': S.statusFilter=el.dataset.v; S.adminPage=1; loadAdmin(); break;
    case 'open-create': S.modal={type:'create'}; S.createStep='form'; S.created=null; renderModal(); break;
    case 'close-modal': closeModal(); break;
    case 'continue-create': S.createStep='form'; S.created=null; renderModal(); break;
    case 'done-create': closeModal(); loadLinks(); break;
    case 'open-detail': openDetail(el.dataset.code); break;
    case 'days': if(S.days!==+el.dataset.n){ S.days=+el.dataset.n; loadHistory(); } break;
    case 'toggle-status': doToggle(el.dataset.code,+el.dataset.target); break;
    case 'ask-delete': S.modal={type:'confirm',data:{code:el.dataset.code}}; renderModal(); break;
    case 'confirm-delete': doDelete(); break;
    case 'copy': copyText(el.dataset.val,()=>toast('已复制到剪贴板')); break;
    case 'open-url': if(el.dataset.val) window.open(el.dataset.val,'_blank','noopener'); break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='login-form'){
    const fd=new FormData(f);
    const u=(fd.get('username')||'').trim(), p=fd.get('password')||'';
    if(!u||!p){ S.authError='请输入用户名和密码'; renderLogin(); return; }
    doLogin(u,p);
  }else if(f.id==='register-form'){
    const fd=new FormData(f);
    const u=(fd.get('username')||'').trim(), p=fd.get('password')||'', nick=(fd.get('nickname')||'').trim();
    if(!/^[a-zA-Z0-9_]{3,32}$/.test(u)){ S.authError='用户名仅支持 3-32 位字母、数字、下划线'; renderLogin(); return; }
    if(p.length<6){ S.authError='密码长度至少 6 位'; renderLogin(); return; }
    doRegister(u,p,nick);
  }else if(f.id==='create-form'){
    doCreate(f);
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ============ 启动 ============ */
function init(){
  if(user&&token){
    renderApp();
    if(S.view==='admin'&&user.role!=='ADMIN') S.view='links';
    if(S.view==='admin') loadAdmin(); else loadLinks();
  }else{
    const qs=new URLSearchParams(location.search);
    if(qs.has('autologin')) doLogin('admin','admin123');
    else renderApp();
  }
}
init();
</script>

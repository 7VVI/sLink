server:
  port: 8080

spring:
  application:
    name: short-link-server
  # 默认 dev（业务 DEBUG + SQL 日志）；生产环境用 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: dev
  datasource:
    # ShardingSphere-JDBC 驱动模式：分片规则见 classpath:sharding.yaml
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml
    hikari:
      maximum-pool-size: 16
      connection-timeout: 5000
  data:
    redis:
      host: localhost
      port: 6379
      # password:
      database: 0
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

sa-token:
  # token 名称（同时是 cookie / header 名称）
  token-name: shortLinkToken
  # token 有效期（秒），30 天
  timeout: 2592000
  # 允许同一账号多端登录
  is-concurrent: true
  # 多端登录不共享 token
  is-share: false
  token-style: uuid
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

shortlink:
  # 短链对外域名（末尾不带斜杠）
  domain: http://localhost:8080
  id-generator:
    biz-tag: short_url
    preload-threshold: 0.2
    next-segment-wait-timeout: 5s
  cache:
    l1-maximum-size: 50000
    l1-expire-after-write: 30s
    l2-expire: 24h
    negative-expire: 60s
  bloom:
    # 预期插入量，按业务规模调整（误判率 0.1%）
    expected-insertions: 10000000
    false-positive-rate: 0.001
    rebuild-on-startup: true
  stats:
    # RingBuffer 大小必须为 2 的幂
    ring-buffer-size: 65536
    batch-size: 256
    flush-interval: 200ms
    archive-batch-size: 500
  security:
    blacklist-domains:
      - malicious.example.com
      - phishing.example.com
  rate-limit:
    enabled: true
    per-ip-qps: 100
  # 回收站：删除的短链保留 30 天，每天 03:30 自动物理清除
  recycle-bin:
    retention-days: 30
    purge-cron: "0 30 3 * * ?"
    purge-batch-size: 500

#
# ShardingSphere-JDBC 分片配置（Standalone 模式）
#
# 拓扑：4 个库（short_link_ds0-3）× 16 张表（short_url_0-15）= 64 个分片，
# 分片键 short_code（HASH_MOD）。
# 主库 short_link_main 存放 sys_user / leaf_alloc / short_url_stats 等单表。
#
mode:
  type: Standalone
  repository:
    type: JDBC

dataSources:
  main:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://43.138.216.65:40001/short_link_main?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 7vi110
    maximumPoolSize: 8
  ds0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://43.138.216.65:40001/short_link_ds0?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 7vi110
    maximumPoolSize: 8
  ds1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://43.138.216.65:40001/short_link_ds1?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 7vi110
    maximumPoolSize: 8
  ds2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://43.138.216.65:40001/short_link_ds2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 7vi110
    maximumPoolSize: 8
  ds3:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://43.138.216.65:40001/short_link_ds3?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 7vi110
    maximumPoolSize: 8

rules:
  - !SHARDING
    tables:
      short_url:
        actualDataNodes: ds${0..3}.short_url_${0..15}
        databaseStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: short-url-db-hash-mod
        tableStrategy:
          standard:
            shardingColumn: short_code
            shardingAlgorithmName: short-url-table-hash-mod
    shardingAlgorithms:
      # 5.5.x 中 HASH_MOD 属于"自动分片算法"，标准表策略需使用 INLINE 表达式实现哈希取模
      short-url-db-hash-mod:
        type: INLINE
        props:
          algorithm-expression: ds${Math.floorMod(short_code.hashCode(), 4)}
      short-url-table-hash-mod:
        type: INLINE
        props:
          algorithm-expression: short_url_${Math.floorMod(short_code.hashCode(), 16)}
  - !SINGLE
    defaultDataSource: main
    tables:
      - "main.*"

props:
  sql-show: false
